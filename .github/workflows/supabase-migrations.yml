name: Deploy Migrations to Supabase

on:
  push:
    branches:
      - main
    # The Supabase root is `supabase/` at the repo root — the one holding
    # config.toml. `dashboard/supabase/` is a leftover from the v2 schema work
    # and has no config, so a push from there could never have worked.
    paths:
      - "supabase/migrations/**"

jobs:
  deploy_migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
